<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>현석🩷재히 🍯🌙 일정</title>
<style>
:root {
  --bg: #FFF3F5;
  --card: #FFFFFF;
  --text: #4A2A35;
  --sub: #9A6F7B;
  --border: #F6D3DB;
  --accent: #E8648A;
  --accent-soft: rgba(232, 100, 138, 0.12);
  --booked-fg: #3E9A6A;
  --booked-bg: #E3F6EC;
  --needed-fg: #C27A12;
  --needed-bg: #FFF0D6;
  --shadow: 0 3px 10px rgba(232, 100, 138, 0.12);
  --popup-bg: #FFFFFF;
  --map-bg: #DDEFF7;
  --leg-bg: #FFF8F9;
  --shell-h: 300px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1E1318;
    --card: #2A1B22;
    --text: #FBE7EC;
    --sub: #C79BA8;
    --border: #4A2E39;
    --accent: #FF8FB0;
    --accent-soft: rgba(255, 143, 176, 0.16);
    --booked-fg: #8EDDB0;
    --booked-bg: #1C3327;
    --needed-fg: #F5BE70;
    --needed-bg: #3E2C12;
    --shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
    --popup-bg: #33202A;
    --map-bg: #1d2a33;
    --leg-bg: #231619;
  }
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.mono {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

/* Top sticky map */
.shell-spacer {
  height: var(--shell-h);
}
.top-map-shell {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 500;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
}
.map-pane {
  max-width: 960px;
  margin: 0 auto;
  width: 100%;
  height: 300px;
  position: relative;
  overflow: hidden;
  background: var(--map-bg);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
}
.map-pane.animating {
  transition: height 0.22s ease;
}
.map-pane.collapsed {
  border-left: none;
  border-right: none;
}
.map-pane.will-collapse #map {
  opacity: 0.45;
}
#map {
  width: 100%;
  height: 100%;
  position: relative;
  background: var(--map-bg);
  user-select: none;
  touch-action: none;
  overflow: hidden;
  transition: opacity 0.15s;
}

/* Drag handle under the map */
.map-handle {
  max-width: 960px;
  margin: 0 auto;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: ns-resize;
  touch-action: none;
  user-select: none;
  color: var(--sub);
  font-size: 11.5px;
  font-weight: 600;
  background: var(--card);
  -webkit-tap-highlight-color: transparent;
}
.map-handle:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
.map-handle-grip {
  width: 38px;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
}
.map-handle:hover .map-handle-grip {
  background: var(--accent);
}
.map-handle-label {
  display: none;
}
.map-handle.collapsed .map-handle-label {
  display: inline;
  color: var(--accent);
}
.map-handle.collapsed {
  height: 34px;
}

.list-container {
  max-width: 960px;
  margin: 0 auto;
  padding: 18px 20px 44px;
}

/* Header */
.page-header {
  margin-bottom: 12px;
}
.page-title-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.page-title {
  font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--accent);
}
.page-header {
  position: relative;
  background: var(--card);
  border: 2px dashed var(--border);
  border-radius: 18px;
  padding: 14px 16px;
  box-shadow: var(--shadow);
}
.day-title,
.chip,
.place-name {
  font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  font-weight: 700;
}
.day-title { font-size: 15.5px; }
.page-header::after { content: "💕"; position: absolute; right: 14px; top: 8px; font-size: 22px; animation: floaty 2.6s ease-in-out infinite; }
@keyframes floaty { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-5px) rotate(6deg); } }
@media (prefers-reduced-motion: reduce) { .page-header::after { animation: none; } }
.card-footer .gmaps-dir-link::before { content: "💗 "; }
.footnote::before { content: "🌸 "; }
.place-name { font-size: 13.5px; }
.chip { font-size: 12.5px; padding: 5px 12px; border-width: 1.5px; }
.day-card { border-radius: 16px; }
.place-item { border-radius: 12px; }
.badge, .place-time, .travel-leg-pill { border-radius: 999px; }
.map-label { border-radius: 999px; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; font-weight: 700; }
.map-popup { border-radius: 16px; }
.footnote { border-radius: 16px; border-style: dashed; border-width: 2px; }
.page-subtitle {
  font-size: 13px;
  color: var(--sub);
}
.page-summary {
  margin-top: 3px;
  font-size: 12.5px;
  color: var(--sub);
}

/* Filter chips */
.chips-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: border-color 0.15s, background-color 0.15s, color 0.15s;
  user-select: none;
}
.chip:hover {
  border-color: var(--accent);
}
.chip.active {
  border-color: var(--accent);
  background: var(--accent);
  color: #FFFFFF;
  font-weight: 600;
}
@media (prefers-color-scheme: dark) {
  .chip.active {
    color: #0E1619;
  }
}
.chip-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.chip.active .chip-dot {
  box-shadow: 0 0 0 1.5px rgba(255,255,255,0.85);
}

/* Legend */
.legend-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px;
  font-size: 12px;
  color: var(--sub);
  margin-bottom: 14px;
  padding: 4px 2px;
}
.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.legend-line-solid {
  width: 22px;
  height: 3px;
  background: var(--accent);
  border-radius: 2px;
}
.legend-line-dashed {
  width: 22px;
  height: 0;
  border-top: 3px dashed var(--accent);
}
.legend-circle-dashed {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  border: 1.5px dashed var(--sub);
  background: transparent;
}

/* Day cards */
.cards-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.day-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-left-width: 4px;
  border-radius: 8px;
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: opacity 0.18s, border-color 0.18s;
  scroll-margin-top: calc(var(--shell-h) + 10px);
}
.day-card.dimmed {
  opacity: 0.45;
}
.day-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
}
.day-card-header:hover {
  background: rgba(14, 124, 134, 0.04);
}
.day-header-left {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
  flex-wrap: wrap;
}
.day-date {
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}
.day-title {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--text);
}
.day-metrics {
  font-size: 12px;
  color: var(--sub);
  white-space: nowrap;
  flex-shrink: 0;
}
.day-card-body {
  padding: 10px 14px 12px;
}
.depart-note {
  font-size: 12.5px;
  color: var(--sub);
  margin-bottom: 8px;
  padding-bottom: 7px;
  border-bottom: 1px dashed var(--border);
}
.places-list {
  list-style: none;
  display: flex;
  flex-direction: column;
}

/* Travel leg connector */
.travel-leg {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 0 3px 9px;
  font-size: 11.5px;
  color: var(--sub);
}
.travel-leg-line {
  width: 2px;
  height: 16px;
  border-left: 2px solid var(--border);
  flex-shrink: 0;
}
.travel-leg-line.walk {
  border-left-style: dashed;
  border-left-color: var(--accent);
}
.travel-leg-line.opt {
  border-left-style: dotted;
}
.travel-leg-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--leg-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 7px;
  font-size: 11px;
  color: var(--sub);
}
.place-item {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 6px 8px;
  margin: 0 -8px;
  border-radius: 6px;
  cursor: pointer;
  transition: background-color 0.12s, box-shadow 0.12s;
}
.place-item:hover {
  background: rgba(14, 124, 134, 0.06);
}
.place-item.selected-place {
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.place-marker-icon {
  width: 21px;
  height: 21px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  margin-top: 1px;
  color: #FFFFFF;
  border-radius: 50%;
}
.place-marker-icon.stay {
  border-radius: 5px;
  font-size: 12px;
}
.place-marker-icon.opt {
  background: transparent !important;
  border: 1.5px dashed;
}
.place-content {
  min-width: 0;
  flex: 1;
}
.place-top {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.place-time {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 1px 6px;
  border-radius: 4px;
  white-space: nowrap;
}
.place-name {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
}
.place-name.opt {
  color: var(--sub);
  font-weight: 500;
}
.badge {
  display: inline-flex;
  align-items: center;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  line-height: 1.4;
}
.badge-booked {
  color: var(--booked-fg);
  background: var(--booked-bg);
}
.badge-needed {
  color: var(--needed-fg);
  background: var(--needed-bg);
}
.badge-opt {
  color: var(--sub);
  border: 1px dashed var(--sub);
  background: transparent;
  font-weight: 500;
}
.place-note {
  font-size: 12.5px;
  color: var(--sub);
  margin-top: 2px;
  word-break: keep-all;
}
.card-footer {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
}
.gmaps-dir-link {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  text-decoration: none;
}
.gmaps-dir-link:hover {
  text-decoration: underline;
}

/* Footnote */
.footnote {
  margin-top: 18px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--sub);
  padding: 12px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
}

/* Map controls */
.btn-reset-view {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 600;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.14);
  cursor: pointer;
}
.btn-reset-view:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.map-zoom-controls {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 600;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  background: var(--card);
  box-shadow: 0 1px 4px rgba(0,0,0,0.14);
}
.map-zoom-btn {
  width: 28px;
  height: 28px;
  border: none;
  background: var(--card);
  color: var(--text);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.map-zoom-btn:first-child {
  border-bottom: 1px solid var(--border);
}
.map-zoom-btn:hover {
  background: rgba(14, 124, 134, 0.08);
}
.map-attribution {
  position: absolute;
  bottom: 0;
  right: 0;
  z-index: 550;
  background: rgba(255, 255, 255, 0.78);
  color: #333;
  font-size: 10px;
  padding: 1px 6px;
  pointer-events: auto;
}
@media (prefers-color-scheme: dark) {
  .map-attribution {
    background: rgba(14, 22, 25, 0.8);
    color: #93A6A9;
  }
}
.map-tooltip {
  position: absolute;
  z-index: 650;
  pointer-events: none;
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 3px 8px;
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
  box-shadow: 0 2px 6px rgba(0,0,0,0.16);
  display: none;
}
.map-pin {
  position: absolute;
  width: 24px;
  height: 24px;
  margin-left: -12px;
  margin-top: -12px;
  border-radius: 50%;
  border: 2px solid #FFFFFF;
  color: #FFFFFF;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,0.28);
  transition: opacity 0.18s, transform 0.12s;
  z-index: 400;
}
.map-pin:hover,
.map-pin.active-pin {
  transform: scale(1.18);
  z-index: 480;
}
.map-pin.stay {
  border-radius: 6px;
  font-size: 12px;
}
.map-pin.opt {
  background: #FFFFFF !important;
  border: 2px dashed;
}
.map-pin.dimmed {
  opacity: 0.28;
  z-index: 300;
}

/* Place-name labels shown on the selected day's route */
.map-label {
  position: absolute;
  z-index: 360;
  pointer-events: none;
  padding: 2px 7px;
  border-radius: 5px;
  background: var(--card);
  color: var(--text);
  border: 1.5px solid var(--accent);
  font-size: 11.5px;
  font-weight: 700;
  line-height: 16px;
  white-space: nowrap;
  box-shadow: 0 1px 4px rgba(0,0,0,0.22);
}
.map-label.opt {
  border-style: dashed;
  color: var(--sub);
  font-weight: 600;
}

.map-popup {
  position: absolute;
  z-index: 700;
  width: 256px;
  background: var(--popup-bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.22);
  font-size: 12.5px;
  line-height: 1.45;
  display: none;
  transform: translate(-50%, calc(-100% - 18px));
}
.map-popup::after {
  content: "";
  position: absolute;
  bottom: -6px;
  left: 50%;
  margin-left: -6px;
  width: 10px;
  height: 10px;
  background: var(--popup-bg);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  transform: rotate(45deg);
}
.popup-close {
  position: absolute;
  top: 6px;
  right: 8px;
  background: none;
  border: none;
  color: var(--sub);
  font-size: 15px;
  cursor: pointer;
  line-height: 1;
}
.popup-dates {
  font-size: 11px;
  color: var(--sub);
  margin-bottom: 3px;
  padding-right: 14px;
}
.popup-title-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 4px;
}
.popup-name {
  font-weight: 700;
  font-size: 13px;
  color: var(--text);
}
.popup-note {
  color: var(--sub);
  font-size: 12px;
  margin-bottom: 7px;
}
.popup-footer {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
}
.popup-gmaps {
  color: var(--accent);
  font-weight: 600;
  text-decoration: none;
}
.popup-gmaps:hover {
  text-decoration: underline;
}
.popup-approx {
  color: var(--sub);
}

@media (max-width: 760px) {
  .map-pane {
    border-left: none;
    border-right: none;
  }
  .list-container {
    padding: 14px 16px 36px;
  }
  .day-card-header {
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .map-pane.animating { transition: none; }
}
</style>
</head>
<body>

<div class="top-map-shell" id="mapShell">
  <aside class="map-pane" id="mapPane" aria-label="동선 지도">
    <div id="map">
      <div class="map-zoom-controls">
        <button type="button" class="map-zoom-btn" id="btnZoomIn" aria-label="확대">+</button>
        <button type="button" class="map-zoom-btn" id="btnZoomOut" aria-label="축소">−</button>
      </div>
      <button type="button" class="btn-reset-view" id="btnResetView">전체 보기</button>
      <div class="map-tooltip" id="mapTooltip"></div>
      <div class="map-popup" id="mapPopup"></div>
      <div class="map-attribution">Tiles © Esri · © OpenStreetMap contributors · © CARTO</div>
    </div>
  </aside>
  <div class="map-handle" id="mapHandle" role="button" tabindex="0" aria-label="지도 크기 조절. 위로 끝까지 밀면 지도가 접힙니다">
    <span class="map-handle-grip"></span>
    <span class="map-handle-label" id="mapHandleLabel">▾ 지도 펼치기</span>
  </div>
</div>
<div class="shell-spacer" id="shellSpacer" aria-hidden="true"></div>

<main class="list-container">
  <header class="page-header">
    <div class="page-title-row">
      <h1 class="page-title">현석🩷재히 🍯🌙 일정 ✨</h1>
      <span class="page-subtitle">🐑 뉴질랜드 🕊️ · Christchurch → Queenstown · 날짜별 동선</span>
    </div>
    <div class="page-summary mono" id="totalSummary">2/28 – 3/10 · 주행 약 895 km</div>
  </header>

  <nav class="chips-bar" id="chipsBar" aria-label="날짜 필터"></nav>

  <div class="legend-bar">
    <span class="legend-item"><span class="legend-line-solid"></span>차로 이동</span>
    <span class="legend-item"><span class="legend-line-dashed"></span>걸어서 이동</span>
    <span class="legend-item"><span class="legend-circle-dashed"></span>선택 일정</span>
  </div>

  <section class="cards-list" id="cardsList"></section>

  <footer class="footnote" id="footnoteBox"></footer>

    if (!pinByKey.has(key)) {
      const pin = {
        key,
        name: place.name,
        en: place.en,
        lat: place.lat,
        lng: place.lng,
        color: day.color,
        number: idx + 1,
        kind: place.kind,
        status: place.status,
        opt: place.opt,
        approx: place.approx,
        note: place.note,
        timeLabel: place.timeLabel || "",
        stayText: place.stayText || "",
        dates: [dateLabel],
        dayIds: [day.id]
      };
      pinByKey.set(key, pin);
      uniquePins.push(pin);
    } else {
      const existing = pinByKey.get(key);
      if (!existing.dates.includes(dateLabel)) {
        existing.dates.push(dateLabel);
      }
      if (!existing.dayIds.includes(day.id)) {
        existing.dayIds.push(day.id);
      }
      if (!existing.stayText && place.stayText) {
        existing.stayText = place.stayText;
      }
    }
    place._pinKey = key;
  });
});

// 3. Google Maps directions URL
function buildDirectionsUrl(waypoints) {
  if (!waypoints || waypoints.length < 2) return "#";
  const fmt = pt => pt[0] + "," + pt[1];
  const origin = fmt(waypoints[0]);
  const destination = fmt(waypoints[waypoints.length - 1]);
  const mids = waypoints.slice(1, -1).slice(0, 9).map(fmt);
  let url = "https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=" +
    encodeURIComponent(origin) + "&destination=" + encodeURIComponent(destination);
  if (mids.length > 0) {
    url += "&waypoints=" + encodeURIComponent(mids.join("|"));
  }
  return url;
}

function latLngToWorld(lat, lng, zoom) {
  const scale = TILE_SIZE * Math.pow(2, zoom);
  const x = ((lng + 180) / 360) * scale;
  const sinLat = Math.sin((lat * Math.PI) / 180);
  const y = (0.5 - Math.log((1 + sinLat) / (1 - sinLat)) / (4 * Math.PI)) * scale;
  return { x, y };
}

function worldToLatLng(x, y, zoom) {
  const scale = TILE_SIZE * Math.pow(2, zoom);
  const lng = (x / scale) * 360 - 180;
  const n = Math.PI - (2 * Math.PI * y) / scale;
  const lat = (180 / Math.PI) * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
  return { lat, lng };
}

function mapSize() {
  return {
    w: mapEl.clientWidth || window.innerWidth || 720,
    h: mapEl.clientHeight || 280
  };
}

function latLngToContainer(lat, lng) {
  const s = mapSize();
  const cWorld = latLngToWorld(state.centerLat, state.centerLng, state.zoom);
  const pWorld = latLngToWorld(lat, lng, state.zoom);
  return {
    x: s.w / 2 + (pWorld.x - cWorld.x),
    y: s.h / 2 + (pWorld.y - cWorld.y)
  };
}

function fitBounds(coords, maxZoomCap) {
  maxZoomCap = maxZoomCap || 14;
  if (!coords || coords.length === 0) return;
  const s = mapSize();
  const padX = 44;
  const padY = 34;

  let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
  coords.forEach(function (c) {
    const lat = c[0], lng = c[1];
    if (lat < minLat) minLat = lat;
    if (lat > maxLat) maxLat = lat;
    if (lng < minLng) minLng = lng;
    if (lng > maxLng) maxLng = lng;
  });

  const centerLat = (minLat + maxLat) / 2;
  const centerLng = (minLng + maxLng) / 2;

  let bestZoom = MIN_ZOOM;
  for (let z = maxZoomCap; z >= MIN_ZOOM; z--) {
    const nw = latLngToWorld(maxLat, minLng, z);
    const se = latLngToWorld(minLat, maxLng, z);
    const spanX = Math.abs(se.x - nw.x);
    const spanY = Math.abs(se.y - nw.y);
    if (spanX <= Math.max(40, s.w - padX * 2) && spanY <= Math.max(40, s.h - padY * 2)) {
      bestZoom = z;
      break;
    }
  }

  state.centerLat = centerLat;
  state.centerLng = centerLng;
  state.zoom = bestZoom;
  renderMap();
}

function getAllBoundsCoords() {
  const pts = [];
  ITINERARY.forEach(d => {
    d.driveCoords.forEach(c => pts.push(c));
    d.walkCoords.forEach(c => pts.push(c));
    d.places.forEach(p => pts.push([p.lat, p.lng]));
  });
  return pts;
}

function getDayBoundsCoords(dayId) {
  const day = ITINERARY.find(d => d.id === dayId);
  if (!day) return getAllBoundsCoords();
  const pts = [];
  day.driveCoords.forEach(c => pts.push(c));
  day.walkCoords.forEach(c => pts.push(c));
  day.places.forEach(p => pts.push([p.lat, p.lng]));
  return pts;
}

function getTileUrl(z, x, y, attempt) {
  attempt = attempt || 0;
  const sub = "abcd"[(x + y) % 4];
  if (attempt === 0) {
    if (state.isDark) return "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/" + z + "/" + y + "/" + x;
    return "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/" + z + "/" + y + "/" + x;
  }
  if (attempt === 1) {
    return "https://" + sub + ".basemaps.cartocdn.com/" + (state.isDark ? "dark_all" : "rastertiles/voyager") + "/" + z + "/" + x + "/" + y + ".png";
  }
  if (attempt === 2) return "https://tile.openstreetmap.org/" + z + "/" + x + "/" + y + ".png";
  return null;
}

function renderTiles() {
  tileLayerDiv.innerHTML = "";
  if (!state.tilesEnabled) return;

  const s = mapSize();
  const z = Math.round(state.zoom);
  const scaleFactor = Math.pow(2, state.zoom - z);
  const effectiveTileSize = TILE_SIZE * scaleFactor;

  const cWorld = latLngToWorld(state.centerLat, state.centerLng, z);
  const topLeftWorldX = cWorld.x - (s.w / 2) / scaleFactor;
  const topLeftWorldY = cWorld.y - (s.h / 2) / scaleFactor;

  const minTileX = Math.floor(topLeftWorldX / TILE_SIZE);
  const minTileY = Math.floor(topLeftWorldY / TILE_SIZE);
  const maxTileX = Math.floor((topLeftWorldX + s.w / scaleFactor) / TILE_SIZE);
  const maxTileY = Math.floor((topLeftWorldY + s.h / scaleFactor) / TILE_SIZE);

  const maxIndex = Math.pow(2, z);

  for (let tx = minTileX; tx <= maxTileX; tx++) {
    for (let ty = minTileY; ty <= maxTileY; ty++) {
      if (ty < 0 || ty >= maxIndex) continue;
      const wrappedX = ((tx % maxIndex) + maxIndex) % maxIndex;
      const img = document.createElement("img");
      img.alt = "";
      img.decoding = "async";
      img.style.position = "absolute";
      img.style.width = Math.ceil(effectiveTileSize) + "px";
      img.style.height = Math.ceil(effectiveTileSize) + "px";
      img.style.left = Math.round((tx * TILE_SIZE - topLeftWorldX) * scaleFactor) + "px";
      img.style.top = Math.round((ty * TILE_SIZE - topLeftWorldY) * scaleFactor) + "px";
      img.onerror = function () { const n = (+this.dataset.n || 0) + 1; this.dataset.n = n; const u = getTileUrl(z, wrappedX, ty, n); if (u) { this.src = u; } else { this.style.display = "none"; } };
      img.src = getTileUrl(z, wrappedX, ty);
      tileLayerDiv.appendChild(img);
    }
  }
}

function dayIndexOfPin(pin, dayId) {
  const day = ITINERARY.find(d => d.id === dayId);
  if (!day) return -1;

}

    el.style.top = pos.y.toFixed(1) + "px";

    const isMatch = !selected || pin.dayIds.includes(selected);
    el.classList.toggle("dimmed", !isMatch);
    el.classList.toggle("active-pin", !!(state.activePopupPin && state.activePopupPin.key === pin.key));

    // On a selected day, number pins by that day's order
    if (pin.kind !== "stay") {

        const di = dayIndexOfPin(pin, selected);
        el.textContent = String(di >= 0 ? di + 1 : pin.number);
      } else {

    }
  });

  renderLabels();

  if (state.activePopupPin) {
    positionPopup(state.activePopupPin);
  }
}

// Place-name labels for the selected day, with simple collision avoidance
function estimateLabelWidth(text) {
  let w = 16;
  for (const ch of text) {
    w += ch.charCodeAt(0) > 255 ? 11.8 : 6.6;
  }
  return Math.ceil(w);
}

function rectsOverlap(a, b) {
  return !(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.h <= b.y || b.y + b.h <= a.y);
}

function renderLabels() {
  labelsLayer.innerHTML = "";
  const selected = state.selectedDayId;

  const day = ITINERARY.find(d => d.id === selected);
  if (!day) return;

  const s = mapSize();
  const LH = 22;
  const items = [];
  const seen = new Set();

  day.places.forEach((p, idx) => {
    if (seen.has(p._pinKey)) return;
    seen.add(p._pinKey);
    const pos = latLngToContainer(p.lat, p.lng);
    const prefix = p.kind === "stay" ? "🏡 " : (idx + 1) + ". ";
    const text = prefix + p.name;
    items.push({ p, pos, text, w: estimateLabelWidth(text) });
  });

  // pins occupy space too
  const placed = items.map(it => ({ x: it.pos.x - 13, y: it.pos.y - 13, w: 26, h: 26 }));

  items.forEach(it => {
    const x = it.pos.x, y = it.pos.y, w = it.w;
    const candidates = [
      { x: x + 16, y: y - LH / 2 },
      { x: x - 16 - w, y: y - LH / 2 },
      { x: x - w / 2, y: y - 16 - LH },
      { x: x - w / 2, y: y + 16 },
      { x: x + 12, y: y - 14 - LH },
      { x: x + 12, y: y + 14 },
      { x: x - 12 - w, y: y - 14 - LH },
      { x: x - 12 - w, y: y + 14 },
      { x: x + 16, y: y - LH / 2 - 26 },
      { x: x + 16, y: y - LH / 2 + 26 },
      { x: x - 16 - w, y: y - LH / 2 - 26 },
      { x: x - 16 - w, y: y - LH / 2 + 26 }
    ];

    let chosen = null;
    for (let i = 0; i < candidates.length; i++) {
      const c = candidates[i];
      const r = { x: c.x, y: c.y, w: w, h: LH };
      const inside = r.x >= 2 && r.y >= 2 && r.x + r.w <= s.w - 2 && r.y + r.h <= s.h - 2;
      if (!inside) continue;
      if (placed.some(o => rectsOverlap(r, o))) continue;
      chosen = r;
      break;
    }
    if (!chosen) {
      // fallback: first candidate clamped inside the map
      const c = candidates[0];
      chosen = {
        x: Math.max(2, Math.min(s.w - w - 2, c.x)),
        y: Math.max(2, Math.min(s.h - LH - 2, c.y)),
        w: w,
        h: LH
      };
    }
    placed.push(chosen);

    const el = document.createElement("div");
    el.className = "map-label" + (it.p.opt ? " opt" : "");
    el.style.left = chosen.x.toFixed(1) + "px";
    el.style.top = chosen.y.toFixed(1) + "px";
    el.style.borderColor = day.color;
    el.textContent = it.text;
    labelsLayer.appendChild(el);
  });
}

function positionPopup(pin) {
  const pos = latLngToContainer(pin.lat, pin.lng);
  const s = mapSize();
  const clampedX = Math.max(136, Math.min(s.w - 136, pos.x));
  popupEl.style.left = clampedX.toFixed(1) + "px";
  popupEl.style.top = Math.max(125, pos.y).toFixed(1) + "px";
}

function openPinPopup(pin) {
  state.activePopupPin = pin;

  const staySuffix = (pin.kind === "stay" && pin.stayText) ? " · " + escapeHtml(pin.stayText) : "";
  const dateHeader = pin.dates.join(", ") + staySuffix;

  let badgeHtml = "";
  if (pin.opt) {
    badgeHtml = '<span class="badge badge-opt">선택</span>';
  } else if (pin.status === "booked") {
    badgeHtml = '<span class="badge badge-booked">예약 완료</span>';
  } else if (pin.status === "needed") {
    badgeHtml = '<span class="badge badge-needed">예약 필요</span>';
  }

  const searchUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(pin.en);
  const approxHtml = pin.approx ? '<span class="popup-approx">· 위치 대략</span>' : "";

  popupEl.innerHTML =
    '<button type="button" class="popup-close" aria-label="닫기">×</button>' +
    '<div class="popup-dates mono">' + dateHeader + '</div>' +
    '<div class="popup-title-row"><span class="popup-name">' + escapeHtml(pin.name) + '</span>' + badgeHtml + '</div>' +
    '<div class="popup-note">' + escapeHtml(pin.note) + '</div>' +
    '<div class="popup-footer"><a class="popup-gmaps" href="' + searchUrl +
    '" target="_blank" rel="noopener noreferrer">구글 지도에서 보기 ↗</a>' + approxHtml + '</div>';

  popupEl.querySelector(".popup-close").addEventListener("click", e => {
    e.stopPropagation();
    closePopup();
  });

  popupEl.style.display = "block";
  renderPins();
}

function closePopup() {
  state.activePopupPin = null;
  popupEl.style.display = "none";
  renderPins();
}

function renderMap() {
  renderLand();
  renderTiles();
  renderPolylines();
  renderPins();
}

// Pan & zoom
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;
let dragStartCenterWorld = null;

mapEl.addEventListener("pointerdown", e => {
  if (e.target.closest(".map-pin, .map-popup, .btn-reset-view, .map-zoom-controls")) return;
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragStartCenterWorld = latLngToWorld(state.centerLat, state.centerLng, state.zoom);
  mapEl.setPointerCapture(e.pointerId);
});

mapEl.addEventListener("pointermove", e => {
  if (!isDragging) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  const nextCenter = worldToLatLng(dragStartCenterWorld.x - dx, dragStartCenterWorld.y - dy, state.zoom);
  state.centerLat = Math.max(-85, Math.min(85, nextCenter.lat));
  state.centerLng = nextCenter.lng;
  renderMap();
});

mapEl.addEventListener("pointerup", e => {
  if (isDragging) {
    isDragging = false;
    if (Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY) < 4) {
      closePopup();
    }
  }
});

mapEl.addEventListener("wheel", e => {
  e.preventDefault();
  const delta = e.deltaY < 0 ? 1 : -1;
  const nextZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, state.zoom + delta));
  if (nextZoom !== state.zoom) {
    state.zoom = nextZoom;
    renderMap();
  }
}, { passive: false });

document.getElementById("btnZoomIn").addEventListener("click", e => {
  e.stopPropagation();
  if (state.zoom < MAX_ZOOM) {
    state.zoom += 1;
    renderMap();
  }
});

document.getElementById("btnZoomOut").addEventListener("click", e => {
  e.stopPropagation();
  if (state.zoom > MIN_ZOOM) {
    state.zoom -= 1;
    renderMap();
  }
});

// 6. Map height: drag the handle to resize; push up past the minimum to fold the map away
const MIN_MAP_H = 150;
const COLLAPSE_AT = 100;
let mapH = Math.round(Math.min(Math.max(window.innerHeight * 0.36, 220), 340));
let collapsed = false;

function maxMapH() {
  return Math.max(MIN_MAP_H + 40, Math.round(window.innerHeight * 0.65));
}

function updateShellHeight() {
  document.documentElement.style.setProperty("--shell-h", mapShell.offsetHeight + "px");
}

function applyMapHeight(h) {
  mapPane.style.height = h + "px";
  updateShellHeight();
  renderMap();
}

function setCollapsed(next, animate) {
  collapsed = next;
  if (animate) mapPane.classList.add("animating");
  mapPane.classList.toggle("collapsed", collapsed);
  mapHandle.classList.toggle("collapsed", collapsed);
  mapHandleLabel.setAttribute("aria-hidden", String(!collapsed));
  if (collapsed) {
    closePopup();
    mapPane.style.height = "0px";
    updateShellHeight();
  } else {
    mapPane.style.height = mapH + "px";
    updateShellHeight();
    renderMap();
    setTimeout(function () { renderMap(); updateShellHeight(); }, 240);
  }
  setTimeout(function () {
    mapPane.classList.remove("animating");
    updateShellHeight();
  }, 260);
}

let handleDrag = null;
let rafPending = false;

function scheduleRender() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(function () {
    rafPending = false;
    renderMap();
    updateShellHeight();
  });
}

mapHandle.addEventListener("pointerdown", e => {
  handleDrag = {
    startY: e.clientY,
    startH: collapsed ? 0 : mapH,
    raw: collapsed ? 0 : mapH,
    moved: false
  };
  mapPane.classList.remove("animating");
  mapHandle.setPointerCapture(e.pointerId);
});

mapHandle.addEventListener("pointermove", e => {
  if (!handleDrag) return;
  const dy = e.clientY - handleDrag.startY;
  if (Math.abs(dy) > 4) handleDrag.moved = true;
  if (!handleDrag.moved) return;

  const raw = handleDrag.startH + dy;
  handleDrag.raw = raw;

  if (raw < COLLAPSE_AT) {
    // pushing past the minimum: the map shrinks further and fades to show it will fold away
    mapPane.classList.add("will-collapse");
    mapPane.classList.remove("collapsed");
    mapPane.style.height = Math.max(0, raw) + "px";
  } else {
    mapPane.classList.remove("will-collapse");
    mapPane.classList.remove("collapsed");
    mapH = Math.max(MIN_MAP_H, Math.min(maxMapH(), raw));
    mapPane.style.height = mapH + "px";
    if (collapsed) {
      collapsed = false;
      mapHandle.classList.remove("collapsed");
    }
  }
  scheduleRender();
});

function endHandleDrag(e) {
  if (!handleDrag) return;
  const d = handleDrag;
  handleDrag = null;
  mapPane.classList.remove("will-collapse");
  try { mapHandle.releasePointerCapture(e.pointerId); } catch (err) {}

  if (!d.moved) {
    setCollapsed(!collapsed, true);
    return;
  }
  if (d.raw < COLLAPSE_AT) {
    setCollapsed(true, true);
  } else {
    collapsed = false;
    mapHandle.classList.remove("collapsed");
    mapPane.classList.remove("collapsed");
    mapPane.style.height = mapH + "px";
    renderMap();
    updateShellHeight();
  }
}
mapHandle.addEventListener("pointerup", endHandleDrag);
mapHandle.addEventListener("pointercancel", endHandleDrag);

mapHandle.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    setCollapsed(!collapsed, true);
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    if (!collapsed) {
      if (mapH - 40 < MIN_MAP_H) {
        setCollapsed(true, true);
      } else {
        mapH -= 40;
        applyMapHeight(mapH);
      }
    }
  } else if (e.key === "ArrowDown") {
    e.preventDefault();
    if (collapsed) {
      setCollapsed(false, true);
    } else {
      mapH = Math.min(maxMapH(), mapH + 40);
      applyMapHeight(mapH);
    }
  }
});

// 7. Day selection & highlighting
function clearPlaceHighlight() {
  cardsList.querySelectorAll(".place-item.selected-place").forEach(el => {
    el.classList.remove("selected-place");
  });
}

function selectDay(dayId, toggleIfSame) {
  closePopup();
  clearPlaceHighlight();
  if (toggleIfSame && state.selectedDayId === dayId) {
    state.selectedDayId = null;
  } else {
    state.selectedDayId = dayId;
  }

  chipsBar.querySelectorAll(".chip").forEach(chip => {
    const cid = chip.dataset.dayId;
    const active = state.selectedDayId === null ? cid === "ALL" : cid === state.selectedDayId;
    chip.classList.toggle("active", active);
  });

  cardsList.querySelectorAll(".day-card").forEach(card => {
    const isDimmed = state.selectedDayId !== null && card.dataset.dayId !== state.selectedDayId;
    card.classList.toggle("dimmed", isDimmed);
  });

  // selecting a day brings the map back so the place names are visible
  if (collapsed && state.selectedDayId !== null) {
    setCollapsed(false, true);
  }

  if (state.selectedDayId === null) {
    fitBounds(getAllBoundsCoords(), 14);
  } else {
    fitBounds(getDayBoundsCoords(state.selectedDayId), 14);
  }
}

chipsBar.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  const id = chip.dataset.dayId;
  if (id === "ALL") {
    selectDay(null, false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    selectDay(id, false);
    const card = cardsList.querySelector('.day-card[data-day-id="' + id + '"]');
    if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
  }
});

cardsList.addEventListener("click", e => {
  if (e.target.closest(".gmaps-dir-link")) return;

  const placeEl = e.target.closest(".place-item");
  if (placeEl) {
    if (collapsed) setCollapsed(false, true);
    clearPlaceHighlight();
    placeEl.classList.add("selected-place");

    const pinKey = placeEl.dataset.pinKey;
    const pin = pinByKey.get(pinKey);
    if (pin) {
      state.centerLat = pin.lat;
      state.centerLng = pin.lng;
      if (state.zoom < 12) state.zoom = 13;
      renderMap();
      openPinPopup(pin);
    }
    return;
  }

  const headerEl = e.target.closest(".day-card-header");
  if (headerEl) {
    selectDay(headerEl.dataset.dayId, true);
  }
});

document.getElementById("btnResetView").addEventListener("click", e => {
  e.stopPropagation();
  selectDay(null, false);
});

// keep the spacer in sync with the floating map, including during animations
if (window.ResizeObserver) {
  new ResizeObserver(function () { updateShellHeight(); }).observe(mapShell);
}

// init
mapPane.style.height = mapH + "px";
updateShellHeight();
fitBounds(getAllBoundsCoords(), 14);

window.addEventListener("resize", () => {
  if (!collapsed) {
    mapH = Math.max(MIN_MAP_H, Math.min(maxMapH(), mapH));
    mapPane.style.height = mapH + "px";
  }
  updateShellHeight();
  renderMap();
});

if (window.matchMedia) {
  const darkMq = window.matchMedia("(prefers-color-scheme: dark)");
  const onThemeChange = e => {
    state.isDark = e.matches;
    renderTiles();
  };
  if (darkMq.addEventListener) {
    darkMq.addEventListener("change", onThemeChange);
  } else if (darkMq.addListener) {
    darkMq.addListener(onThemeChange);
  }
}

window.addEventListener("load", () => {
  state.tilesEnabled = true;
  updateShellHeight();
  renderMap();
});
})();
</script>
</body>
</html>
